[build]
  command = "npm run build"
  publish = "dist"

# IMPORTANT: replace this with your real Railway backend URL once it's deployed
# (e.g. https://agro-backend-production.up.railway.app)
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE_WITH_RAILWAY_BACKEND_URL/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://REPLACE_WITH_RAILWAY_BACKEND_URL/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
