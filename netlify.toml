[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://agro-backend-fzgm.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://agro-backend-fzgm.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
